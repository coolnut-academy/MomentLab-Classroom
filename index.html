function beam(light=false){const stroke=light?'#507e62':'#bad6b5',bar=light?'#315e4b':'#d6e9bd',block=light?'#a5bf87':'#7ba778';return `<div class="beam-visual ${light?'':'banner-beam'}" aria-hidden="true"><svg viewBox="0 0 448 218"><circle class="beam-circle" cx="224" cy="105" r="83"/><circle class="beam-circle" cx="224" cy="105" r="111"/><path d="M30 172h387M224 24v158" stroke="${stroke}" stroke-opacity=".12" stroke-dasharray="3 5"/><g class="beam-rotor"><path d="M73 103h301" stroke="${bar}" stroke-width="7" stroke-linecap="round"/><path d="M84 99v9m13-9v9m13-9v9m13-9v9m13-9v9m13-9v9m13-9v9m13-9v9m13-9v9m13-9v9m13-9v9m13-9v9m13-9v9m13-9v9m13-9v9m13-9v9m13-9v9m13-9v9m13-9v9m13-9v9m13-9v9m13-9v9" stroke="${light?'#f4f8ed':'#305746'}" stroke-width="1"/><path d="M113 103v43m223-43v43" stroke="${stroke}" stroke-width="1.7"/><rect x="89" y="141" width="48" height="30" rx="5" fill="${block}"/><rect x="316" y="141" width="40" height="25" rx="5" fill="${light?'#779e6b':'#a7c08e'}"/><path d="m103 58 10 8 10-8m-10 8V39m213 17 10 8 10-8m-10 8V37" stroke="${stroke}" stroke-width="1.3" fill="none"/><path d="M118 76h101m13 0h99" stroke="${stroke}" stroke-opacity=".4" stroke-dasharray="3 4"/><text x="162" y="69" fill="${stroke}" font-size="11" font-family="Georgia,serif" font-style="italic">d₁</text><text x="274" y="69" fill="${stroke}" font-size="11" font-family="Georgia,serif" font-style="italic">d₂</text></g><path d="m224 107-21 56h42z" fill="${light?'#e1ebd9':'#315e4d'}" stroke="${stroke}" stroke-width="1.4"/><circle cx="224" cy="103" r="5" fill="${light?'#e1ebd9':'#153f39'}" stroke="${stroke}" stroke-width="2"/><path d="M189 172h70" stroke="${stroke}" stroke-opacity=".3" stroke-linecap="round" stroke-width="3"/><text x="224" y="198" fill="${stroke}" text-anchor="middle" font-size="10" font-family="Tahoma,sans-serif" opacity=".8">สมดุลเริ่มต้นจากความเข้าใจ</text></svg></div>`;}

'use strict';
const DEPLOYED_URL = "https://script.google.com/a/macros/hongson.ac.th/s/AKfycbx7siPkwiUpfv21R6tc80sx6qTkvuU_Z9vhSu0102Vd6btC2jghlopmPGmPU2F8ABAU/exec"; // Deployment helper inserts the real GAS URL, never a secret.
const HAS_GAS=typeof google!=='undefined'&&!!google.script?.run;
if(!HAS_GAS&&DEPLOYED_URL&&!location.search.includes('preview'))location.replace(DEPLOYED_URL+location.hash);
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=id=>`<svg fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><use href="#i-${id}"/></svg>`;
const btn=(text,action,kind='',ico='')=>`<button class="button ${kind}" data-action="${action}">${ico?icon(ico):''}${text}</button>`;
const uuid=()=>crypto.randomUUID?.()||Array.from(crypto.getRandomValues(new Uint8Array(16)),x=>x.toString(16).padStart(2,'0')).join('');
const newToken=()=>Array.from(crypto.getRandomValues(new Uint8Array(32)),x=>x.toString(16).padStart(2,'0')).join('');
const PHASE={LOBBY:'รอครูเริ่มแบบทดสอบ',LIVE:'กำลังทำแบบทดสอบ',CLOSED:'ปิดรับคำตอบแล้ว',REVIEW:'ช่วงอภิปรายร่วมกัน',ARCHIVED:'จบกิจกรรม Q0'};
const TOPICS=['แขนโมเมนต์และทิศการหมุน','น้ำหนักไม้เมตรกับจุดหมุน','สมดุลเมื่อแรงต่างกัน'];
const ERRORS={INVALID_REQUEST:'ข้อมูลไม่ครบ กรุณาลองใหม่',INVALID_STUDENT:'กรุณากรอกชื่อ ห้อง และเลขที่ 1–30',INVALID_ROOM:'ห้องเรียนเปลี่ยนแล้ว กรุณาโหลดหน้าใหม่',SEAT_TAKEN:'เลขที่นี้เข้าร่วมแล้ว กรุณาแจ้งครูหากต้องการเปลี่ยนอุปกรณ์',CLAIM_INVALID:'การเข้าร่วมเปลี่ยนไป กรุณาแจ้งครูหรือเข้าร่วมใหม่',SESSION_CHANGED:'ครูเปิดห้องใหม่แล้ว กรุณาโหลดหน้าใหม่',NOT_OPEN:'ห้องนี้ปิดรับผู้เข้าร่วมแล้ว',NOT_LIVE:'ปิดรับคำตอบแล้ว กรุณาแจ้งครู',DEADLINE_PASSED:'หมดเวลาแล้ว ไม่สามารถส่งคำตอบใหม่ได้',INVALID_ANSWERS:'กรุณาเลือกคำตอบให้ครบทั้ง 3 ข้อ',SUBMISSION_CONFLICT:'บันทึกคำตอบนี้แล้ว ไม่สามารถเปลี่ยนคำตอบได้',CONTENT_PENDING:'กำลังจัดเตรียมชุดคำถาม กรุณารอสักครู่',ALREADY_STARTED:'แบบทดสอบเริ่มไปแล้ว',BAD_STATE:'ทำรายการนี้ไม่ได้ในช่วงปัจจุบัน กรุณาปิดแบบทดสอบก่อน',INVALID_PAPER:'กรุณาระบุจำนวน 0–30 และเลขที่โดยไม่ซ้ำกัน',TEACHER_DENIED:'รหัสครูไม่ถูกต้อง',TEACHER_EXPIRED:'หมดเวลาเข้าสู่ระบบครู กรุณาใส่รหัสอีกครั้ง',TOO_MANY_ATTEMPTS:'ใส่รหัสผิดหลายครั้ง กรุณารอ 5 นาที',BUSY:'ระบบกำลังรับข้อมูล กรุณาลองอีกครั้ง',NOT_CONFIGURED:'บริการยังตั้งค่าไม่ครบ กรุณาแจ้งผู้ดูแล',STORAGE_UNCONFIRMED:'ยังยืนยันการบันทึกไม่ได้ กรุณาลองส่งซ้ำด้วยคำตอบเดิม',SERVICE_UNAVAILABLE:'เชื่อมต่อบริการไม่สำเร็จ กรุณารอสักครู่แล้วลองใหม่',TIMEOUT:'ยังไม่ได้รับการยืนยัน กรุณาลองอีกครั้ง',NO_BACKEND:'กรุณาเปิดเว็บจากลิงก์ห้องเรียนที่ครูส่งให้'};
let teacherToken='',deviceId='',claim=null,session=null,dashboard=null,snapshot=null,offset=0,view='student',chart=0,online=false,polling=false,pollTimer=null,toastTimer=null,submitting=false,draft={},pending=null,studentStamp='';
try{teacherToken=sessionStorage.getItem('mc-teacher-token')||'';deviceId=localStorage.getItem('mc-device')||uuid();localStorage.setItem('mc-device',deviceId);claim=JSON.parse(localStorage.getItem('mc-current-claim')||'null');}catch{deviceId=uuid();}
if(location.hash==='#teacher'&&teacherToken)view='teacher';
function store(key,value){try{localStorage.setItem(key,JSON.stringify(value));}catch{}}
function notify(text,error=false){clearTimeout(toastTimer);$('#toast').textContent=text;$('#toast').className='toast show'+(error?' error':'');toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),5000);}
function now(){return Date.now()+offset;}
function phase(){return session?.state==='LIVE'&&now()>=session.deadlineAt?'CLOSED':session?.state;}
function clock(){if(!session?.startAt)return'03:00';const sec=Math.ceil(Math.max(0,phase()==='LIVE'?session.deadlineAt-now():0)/1000);return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');}
function fmt(n){return n?new Date(n).toLocaleString('th-TH',{hour:'2-digit',minute:'2-digit',second:'2-digit'}):'—';}
function failure(code){const err=Error(ERRORS[code]||ERRORS.SERVICE_UNAVAILABLE);err.code=code;return err;}
function rpc(action,data={}){return new Promise((resolve,reject)=>{if(!HAS_GAS){reject(failure('NO_BACKEND'));return;}let settled=false;const sent=Date.now();const timeout=setTimeout(()=>{if(!settled){settled=true;reject(failure('TIMEOUT'));}},18000);const complete=()=>{settled=true;clearTimeout(timeout);};google.script.run.withSuccessHandler(r=>{if(settled)return;complete();if(!r?.ok){reject(failure(r?.code||'SERVICE_UNAVAILABLE'));return;}const server=r.data?.serverNow??r.data?.session?.serverNow;if(typeof server==='number')offset=server-(sent+Date.now())/2;resolve(r.data);}).withFailureHandler(()=>{if(settled)return;complete();reject(failure('SERVICE_UNAVAILABLE'));}).api({action,data,teacherToken});});}
function footer(){return`<footer class="footnote"><span>MomentCheck · เรียนรู้จากความคิด ก่อนลงมือทดลอง</span><span>ไม่มีคะแนนเก็บ · ใช้คำตอบจริงเพื่อเริ่มบทสนทนา</span></footer>`;}
function entry(){return`<div class="entry-grid"><section class="entry-copy"><div class="lesson-label">ฟิสิกส์ 2 · สมดุลต่อการหมุน</div><h1>เริ่มจากสิ่งที่เราคิด<br>แล้วค้นพบด้วยการทดลอง</h1><p>ลองเช็กความเข้าใจเรื่องโมเมนต์ของแรง<br>ก่อนออกไปเรียนรู้ด้วยการลงมือทำจริง</p><div class="entry-visual">${beam(true)}</div><div class="entry-facts"><div><strong>3</strong><span>คำถามเชิงความคิด</span></div><div><strong>4</strong><span>ตัวเลือกต่อข้อ</span></div><div><strong>3 นาที</strong><span>เวลารวมทั้งชุด</span></div></div></section><section class="join-panel"><div class="join-title"><span class="join-symbol">${icon('user')}</span><div><h2>พร้อมแล้ว มาเริ่มกัน</h2><p>กรอกข้อมูลของเราเพื่อเข้าทำแบบทดสอบ</p></div></div><form id="joinForm"><label class="field-label" for="studentName">ชื่อ–นามสกุล</label><input class="field" id="studentName" autocomplete="name" maxlength="120" placeholder="เช่น สมชาย ใจดี" required><div class="field-grid"><div><label class="field-label" for="classroom">ห้องเรียน</label><input class="field" id="classroom" value="${esc(session?.classroom||'ม.4/1')}" readonly></div><div><label class="field-label" for="studentNo">เลขที่</label><input class="field" id="studentNo" type="number" min="1" max="30" inputmode="numeric" placeholder="1–30" required></div></div><button class="button primary" type="submit" id="joinButton" ${!online?'disabled':''}>เริ่มทำแบบทดสอบ ${icon('arrow')}</button></form><div class="join-private">ข้อมูลนี้ใช้สำหรับกิจกรรมในห้องเรียนเท่านั้น</div><div class="entry-paper">${icon('paper')}<p>ถ้าเข้าเว็บไซต์ไม่ได้ รับบัตรกระดาษสำรองจากครู<br>แล้วเรียนรู้ไปพร้อมเพื่อน ๆ ได้เลย</p></div><div class="entry-connection"><span class="connection-dot ${online?'':'off'}"></span><span id="connectionText">${online?'เชื่อมต่อห้องเรียนแล้ว':HAS_GAS?'กำลังเชื่อมต่อห้องเรียน...':'รอเปิดผ่านลิงก์ห้องเรียน'}</span></div></section></div>${footer()}`;}
function student(){if(!claim||!snapshot)return entry();const p=phase();if(snapshot.receipt)return`<section class="stage"><div class="ready-orbit">${icon('check')}</div><h1>ส่งคำตอบเรียบร้อยแล้ว</h1><p>ขอบคุณที่แบ่งปันความคิด<br>รอครูชวนอภิปราย แล้วไปทดลองด้วยกัน</p><div class="student-tag">${esc(snapshot.studentName)} · เลขที่ ${claim.studentNo} · ${esc(session.classroom)}</div><div class="receipt">เซิร์ฟเวอร์ยืนยันการบันทึกแล้ว<br>เวลา ${fmt(snapshot.receipt.submittedAtServer)}<br>รหัสอ้างอิง ${esc(snapshot.receipt.submissionId)}</div><p>ไม่คิดคะแนนเก็บ และไม่แสดงถูกผิดระหว่างแบบทดสอบ</p></section>${footer()}`;
if(p==='LOBBY')return`<section class="stage"><div class="ready-orbit">${icon('check')}</div><h1>พร้อมแล้ว รอครูเริ่มได้เลย</h1><p>ข้อมูลของเราถูกบันทึกแล้ว<br>คำถามจะปรากฏอัตโนมัติเมื่อครูเริ่มกิจกรรม</p><div class="student-tag">${esc(snapshot.studentName)} · เลขที่ ${claim.studentNo} · ${esc(session.classroom)}</div><p>3 คำถาม เวลารวม 180 วินาที<br>ไม่ต้องกดเริ่มซ้ำหรือรีเฟรชหน้า</p><div class="entry-connection" style="justify-content:center"><span class="connection-dot"></span>กำลังรอจากห้องเรียน</div></section>${footer()}`;
if(p!=='LIVE'&&!pending)return`<section class="stage"><div class="ready-orbit">${icon('clock')}</div><h1>${p==='CLOSED'?'หมดเวลาตอบแล้ว':'ได้เวลาแลกเปลี่ยนความคิด'}</h1><p>หากยังไม่ได้ส่งคำตอบ ให้แจ้งครูเพื่อใช้บัตรกระดาษ<br>จากนั้นเก็บมือถือ เตรียมทำกิจกรรมทดลองคาน</p></section>${footer()}`;
const questions=snapshot.questions||[];if(!questions.length&&!pending)return'<div class="loading"><span class="spinner"></span><p>กำลังเปิดข้อสอบ...</p></div>';
return`<div class="student-quiz"><div class="quiz-sticky"><div><h2>เลือกตามความคิดของเรา</h2><p>${esc(snapshot.studentName)} · เลขที่ ${claim.studentNo} · <span id="progress">ตอบแล้ว ${Object.keys(draft).length} จาก 3 ข้อ</span></p></div><div><p>เวลาที่เหลือ</p><div class="timer" data-clock>${clock()}</div></div></div>${pending?'<div class="unknown">ส่งแล้วแต่ยังไม่ได้รับการยืนยัน กำลังตรวจสอบการบันทึก โดยคงคำตอบเดิมเพื่อป้องกันการส่งซ้ำ</div>':''}<form id="quizForm">${questions.map((q,i)=>`<section class="quiz-card"><div class="question-index"><span>ข้อที่ ${i+1} จาก 3</span><span>${esc(q.question_id)}</span></div><h3>${esc(q.stem)}</h3><div class="options">${q.choices.map((c,j)=>`<label class="option"><input type="radio" name="${esc(q.question_id)}" value="${esc(c.choice_id)}" ${draft[q.question_id]===c.choice_id?'checked':''} ${pending||p!=='LIVE'?'disabled':''} required><span class="letter">${'ABCD'[j]}</span><span class="option-text">${esc(c.text)}</span></label>`).join('')}</div></section>`).join('')}<div class="submit-bar"><p>${pending?'ลองยืนยันคำตอบเดิมอีกครั้งได้ โดยไม่บันทึกซ้ำ':'ตรวจคำตอบให้ครบทั้ง 3 ข้อก่อนส่ง'}</p><button class="button primary" id="submitButton" type="submit" ${submitting?'disabled':''}>${pending?'ตรวจสอบการส่งอีกครั้ง':'ส่งคำตอบทั้ง 3 ข้อ'} ${icon('send')}</button></div></form></div>${footer()}`;}
function teacher(){if(!dashboard)return'<div class="loading"><span class="spinner"></span><p>กำลังโหลดข้อมูลจากห้องเรียน...</p></div>';const d=dashboard,s=d.session,p=phase(),n=d.submittedCount,q=d.items[chart],action=p==='LOBBY'?btn('เริ่ม Quiz 3 นาที','start','lime','play'):p==='LIVE'?btn('ปิดรับคำตอบ','close','ghost','clock'):p==='CLOSED'?btn('เริ่มอภิปราย / ดูเฉลย','review','lime','book'):p==='REVIEW'?btn('จบกิจกรรม','archive','lime','check'):btn('เปิดห้องใหม่','newSession','lime','plus');
return`<div class="page-heading"><div><h1>ห้องเรียนกำลังคิดอะไร</h1><p>การเข้าร่วมและการส่งคำตอบจากเซิร์ฟเวอร์</p></div><div class="actions">${btn('<span class="desktop-label">ส่งออกผล</span>','export','','download')}${btn('<span class="desktop-label">จอฉาย</span>','projector','','screen')}</div></div><section class="session-banner"><div class="banner-copy"><div class="banner-label"><span></span>ฟิสิกส์ 2 &nbsp; / &nbsp; ${esc(s.classroom)}</div><h2>สมดุลต่อการหมุน</h2><p>${esc(PHASE[p])} · ไม่คิดคะแนนเก็บ</p><div class="banner-bottom">${action}<div class="session-code">รหัสห้องเรียน<strong>${esc(s.sessionCode)}</strong></div></div></div>${beam()}<div class="banner-timer">เวลารวม <strong data-clock>${clock()}</strong></div></section><div class="metrics">${[['users','เข้าร่วมแล้ว',d.readyCount,' / 30','นักเรียนที่เข้าห้องเรียน'],['check','ส่งคำตอบแล้ว',n,' คน','นับจากการบันทึกจริง'],['clock','รอส่งคำตอบ',Math.max(0,d.readyCount-n),' คน','เฉพาะผู้เข้าร่วมแล้ว'],['paper','ใช้บัตรกระดาษ',d.paperFallbackCount,' คน','แยกจากคำตอบในระบบ']].map(([ico,title,value,suffix,note])=>`<article class="metric"><div class="metric-top">${title}<span class="metric-icon">${icon(ico)}</span></div><div class="metric-number">${value}<span>${suffix}</span></div><p class="metric-note">${note}</p></article>`).join('')}</div><div class="main-grid"><section class="panel"><div class="panel-header"><div><h2>การกระจายคำตอบ</h2><p>นับตามรหัสตัวเลือกจริง ไม่ใช่ตำแหน่งหลังสลับ</p></div><span class="panel-tag">ผู้ตอบ ${n} คน</span></div><div class="panel-body"><div class="question-tabs" role="tablist" aria-label="เลือกข้อคำถาม">${[0,1,2].map(i=>`<button class="question-tab ${i===chart?'active':''}" data-chart="${i}" role="tab" aria-selected="${i===chart}">ข้อ ${i+1}</button>`).join('')}</div><div class="question-title"><span class="question-number">0${chart+1}</span><div><strong>${esc(TOPICS[chart])}</strong><small>${esc(q?.stem||'กำลังเตรียมชุดคำถาม')}</small></div></div><div class="bars">${(q?.choices||[]).map(c=>`<div class="bar-row"><span class="bar-label">${esc(c.choice_id)}</span><div class="bar-track"><div class="bar-fill" style="width:${c.percentage}%"></div><span class="bar-text" title="${esc(c.text)}">${esc(c.text)}</span></div><span class="bar-value">${c.count} (${Math.round(c.percentage)}%)</span></div>`).join('')}</div><div class="chart-note">${icon('info')}<span>${n?'จากผู้ส่งจริง '+n+' คน · บัตรกระดาษไม่ถูกนำมาสร้างคำตอบในกราฟ':'ยังไม่มีคำตอบที่ส่งเข้ามา ผู้ที่ยังไม่ได้ส่งไม่ถูกนับเป็นคำตอบผิด'}</span></div>${p==='REVIEW'&&d.answerKey[chart]?`<div class="review-key"><strong>เฉลยรหัส ${esc(d.answerKey[chart].correct_choice_id)}</strong><br>${esc(d.answerKey[chart].explanation)}</div>`:''}</div></section><aside><section class="panel"><div class="panel-header"><div><h2>การส่งงานของนักเรียน</h2><p>อัปเดตอัตโนมัติประมาณทุก 3 วินาที</p></div><span class="panel-tag">Realtime</span></div><div class="panel-body"><div class="seat-summary">${Array.from({length:30},(_,i)=>{const c=d.students.find(c=>c.studentNo===i+1);return`<span class="seat ${c?.submittedAt?'submitted':d.paperStudentNos.includes(i+1)?'paper':c?'ready':''}" title="เลขที่ ${i+1}">${String(i+1).padStart(2,'0')}</span>`;}).join('')}</div><div class="roster-scroll">${d.students.length?`<table class="roster-table"><thead><tr><th>เลขที่ / ชื่อ</th><th>สถานะ</th><th>เวลาส่ง</th></tr></thead><tbody>${[...d.students].sort((a,b)=>a.studentNo-b.studentNo).map(c=>`<tr><td class="roster-name"><strong>${String(c.studentNo).padStart(2,'0')}</strong> &nbsp; ${esc(c.studentName)}${!c.submittedAt?`<br><button class="tiny" data-reset="${c.studentNo}">เปลี่ยนอุปกรณ์ / ปลดเลขที่</button>`:''}</td><td><span class="badge ${c.submittedAt?'done':''}">${c.submittedAt?'ส่งแล้ว':'พร้อมแล้ว'}</span></td><td class="muted">${c.submittedAt?fmt(c.submittedAt):'—'}</td></tr>`).join('')}</tbody></table>`:'<div class="panel-empty">เมื่อนักเรียนกรอกข้อมูล<br>รายชื่อและสถานะจะปรากฏที่นี่</div>'}</div></div></section></aside></div><div class="teacher-controls">${btn('บันทึกบัตรกระดาษ','paper','','paper')}${btn('รีเฟรชข้อมูล','refresh','','clock')}${btn('ห้องใหม่','newSession','','plus')}${btn('ออกจากระบบครู','logout','','shield')}</div>${d.overlapStudentNos.length?`<div class="unknown">เลขที่ ${d.overlapStudentNos.join(', ')} ส่งทั้งเว็บและถูกระบุในยอดกระดาษ กรุณาตรวจการนับซ้ำ</div>`:''}<p id="lastUpdated" class="status-strip ${online?'':'off'}">${online?'เชื่อมต่อแล้ว · อัปเดตล่าสุด '+fmt(Date.now()):'ขาดการเชื่อมต่อ · กำลังพยายามอีกครั้ง'}</p>${footer()}`;}
function projection(){if(!dashboard)return'<div class="loading">กำลังโหลดข้อมูล...</div>';const d=dashboard,p=phase();return`<section class="projection"><div class="projection-head"><span class="small">MomentCheck · ${esc(d.session.classroom)}</span>${btn('กลับหน้าครู','teacher','ghost','close')}</div><div class="projection-main"><h1>สมดุลต่อการหมุน</h1><p class="subline">${p==='LOBBY'?'กรอกข้อมูลของเรา แล้วเตรียมเริ่มพร้อมกัน':p==='LIVE'?'เลือกคำตอบที่ตรงกับความคิดของเรามากที่สุด':'ลองอธิบายเหตุผลของแต่ละตัวเลือกด้วยกัน'}</p><div class="huge-time" data-clock>${clock()}</div><div class="projection-counts"><div><strong>${d.readyCount}</strong><span>เข้าร่วมแล้ว</span></div><div><strong>${d.submittedCount}</strong><span>ส่งคำตอบแล้ว</span></div><div><strong>${d.paperFallbackCount}</strong><span>ใช้บัตรกระดาษ</span></div></div>${['CLOSED','REVIEW','ARCHIVED'].includes(p)?`<div class="projection-bars">${d.items.map((q,i)=>`<div class="projection-item"><h3>ข้อ ${i+1} · ${TOPICS[i]}</h3>${q.choices.map(c=>`<div class="bar-row"><span>${esc(c.choice_id)}</span><div class="bar-track"><div class="bar-fill" style="width:${c.percentage}%"></div></div><span class="bar-value">${c.count}</span></div>`).join('')}</div>`).join('')}</div>`:''}</div><footer><span>ไม่มีคะแนนเก็บ · ไม่แสดงรายชื่อ เลขที่ หรือคำตอบรายบุคคล</span></footer></section>`;}
function render(){const name=$('#studentName')?.value,no=$('#studentNo')?.value;document.body.classList.toggle('projector-mode',view==='projector');$('#app').innerHTML=view==='teacher'?teacher():view==='projector'?projection():student();if(name&&$('#studentName'))$('#studentName').value=name;if(no&&$('#studentNo'))$('#studentNo').value=no;bind();tick();}
function modal(title,body,actions=''){$('#modalBody').innerHTML=`<div class="dialog-header"><h2>${title}</h2><button class="icon-button" data-action="dismiss" aria-label="ปิด">${icon('close')}</button></div><div class="dialog-body">${body}</div>${actions?`<div class="dialog-footer">${actions}</div>`:''}`;if(!$('#modal').open)$('#modal').showModal();}
function dismiss(){$('#modal').close();}
function login(){if(teacherToken){navigate('teacher');return;}modal('พื้นที่ครูผู้สอน',`<div class="join-symbol" style="margin-bottom:18px">${icon('shield')}</div><p>ใส่รหัสลับของครูเพื่อดูการส่งคำตอบและควบคุมกิจกรรม</p><form id="loginForm"><label class="field-label" for="teacherCode">Secret code</label><input class="field" id="teacherCode" type="password" autocomplete="current-password" placeholder="รหัสสำหรับครูเท่านั้น" required><div id="loginError" class="modal-error" role="alert"></div><button class="button primary" style="width:100%;margin-top:12px" type="submit" id="loginButton">เข้าสู่ Dashboard ${icon('arrow')}</button></form>`);$('#loginForm').onsubmit=async e=>{e.preventDefault();const b=$('#loginButton');b.disabled=true;$('#loginError').textContent='';try{const result=await rpc('login',{code:$('#teacherCode').value,deviceId});teacherToken=result.teacherToken;try{sessionStorage.setItem('mc-teacher-token',teacherToken);}catch{}dismiss();await navigate('teacher');}catch(err){$('#loginError').textContent=err.message;b.disabled=false;}};}
async function navigate(next){if((next==='teacher'||next==='projector')&&!teacherToken){login();return;}view=next;location.hash=next;render();await refresh(true);schedule();}
function workKey(){return claim?'mc-work-'+claim.sessionId+'-'+claim.studentNo:'';}
function restoreWork(){try{const v=JSON.parse(localStorage.getItem(workKey())||'{}');draft=v.draft||{};pending=v.pending||null;}catch{draft={};pending=null;}}
function saveWork(){if(claim)store(workKey(),{draft,pending});}
function claimData(){return{sessionId:claim.sessionId,studentNo:claim.studentNo,claimToken:claim.claimToken};}
function bind(){const form=$('#joinForm');if(form)form.onsubmit=async e=>{e.preventDefault();const b=$('#joinButton'),no=Number($('#studentNo').value),name=$('#studentName').value.trim();b.disabled=true;b.innerHTML='<span class="spinner"></span>กำลังบันทึกข้อมูล...';try{if(!name||!Number.isInteger(no)||no<1||no>30)throw failure('INVALID_STUDENT');const key='mc-claim-'+session.sessionId+'-'+no;let saved;try{saved=JSON.parse(localStorage.getItem(key)||'null');}catch{}const record=saved||{sessionId:session.sessionId,studentNo:no,claimToken:newToken(),studentName:name};store(key,record);const result=await rpc('join',{...record,sessionCode:session.sessionCode,studentName:name,classroom:session.classroom});claim=record;store('mc-current-claim',claim);snapshot=result;session=result;restoreWork();online=true;render();}catch(err){notify(err.message,true);b.disabled=false;b.innerHTML='เริ่มทำแบบทดสอบ '+icon('arrow');}};
const quiz=$('#quizForm');if(quiz){quiz.onchange=e=>{if(e.target.type!=='radio'||pending)return;draft[e.target.name]=e.target.value;saveWork();$('#progress').textContent=`ตอบแล้ว ${Object.keys(draft).length} จาก 3 ข้อ`;};quiz.onsubmit=async e=>{e.preventDefault();if(submitting)return;if(!pending&&Object.keys(draft).length!==3){notify(ERRORS.INVALID_ANSWERS,true);return;}pending||={submissionKey:uuid(),answers:{...draft}};saveWork();submitting=true;const b=$('#submitButton');if(b){b.disabled=true;b.innerHTML='<span class="spinner"></span>กำลังรอเซิร์ฟเวอร์ยืนยัน...';}try{const result=await rpc('submit',{...claimData(),...pending});if(!result.accepted||!result.submissionId)throw failure('STORAGE_UNCONFIRMED');snapshot.receipt=result;pending=null;saveWork();notify('เซิร์ฟเวอร์บันทึกคำตอบแล้ว');}catch(err){notify(err.message,true);}finally{submitting=false;render();}};}}
async function refresh(force=false){if(polling)return;polling=true;const before=view;try{if(view==='teacher'||view==='projector'){const result=await rpc('dashboard');if(view!==before)return;dashboard=result;session=result.session;online=true;render();}else if(claim){const result=await rpc('snapshot',claimData());if(view!==before)return;if(snapshot?.questions&&!result.questions&&!result.receipt&&pending)result.questions=snapshot.questions;session=result;snapshot=result;if(result.receipt){pending=null;saveWork();}online=true;const stamp=JSON.stringify([result.state,result.receipt,result.questions]);if(stamp!==studentStamp||force){studentStamp=stamp;render();}}else{const result=await rpc('status');if(view!==before)return;const previous=session;session=result;online=true;if(force||!previous||previous.sessionId!==session.sessionId)render();else{const b=$('#joinButton');if(b)b.disabled=false;const text=$('#connectionText');if(text)text.textContent='เชื่อมต่อห้องเรียนแล้ว';document.querySelector('.connection-dot')?.classList.remove('off');}}}catch(err){online=false;if(err.code==='TEACHER_EXPIRED'&&(view==='teacher'||view==='projector')){teacherToken='';try{sessionStorage.removeItem('mc-teacher-token');}catch{}view='student';dashboard=null;render();login();}else if(['CLAIM_INVALID','SESSION_CHANGED'].includes(err.code)&&claim){claim=null;snapshot=null;try{localStorage.removeItem('mc-current-claim');}catch{}draft={};pending=null;render();notify(err.message,true);}else{const status=$('#lastUpdated');if(status){status.classList.add('off');status.textContent='เชื่อมต่อขัดข้อง · กำลังพยายามอีกครั้ง';}const text=$('#connectionText');if(text)text.textContent=err.message;if(force)notify(err.message,true);}}finally{polling=false;}}
function schedule(){clearTimeout(pollTimer);pollTimer=setTimeout(async()=>{if(!document.hidden)await refresh();schedule();},(document.hidden?10000:3500)+Math.random()*600);}
function tick(){document.querySelectorAll('[data-clock]').forEach(el=>{el.textContent=clock();el.classList.toggle('urgent',phase()==='LIVE'&&session.deadlineAt-now()<30000);});if(phase()==='CLOSED'&&session?.state==='LIVE'&&view==='student'&&snapshot&&!snapshot.receipt&&!pending){session={...session,state:'CLOSED'};render();}}
async function change(action,data={}){await rpc(action,data);await refresh(true);}
async function act(action){try{switch(action){case'dismiss':dismiss();break;case'teacher':await navigate('teacher');break;case'student':await navigate('student');break;case'projector':await navigate('projector');break;case'refresh':await refresh(true);break;case'start':await change('start');notify('เริ่มแบบทดสอบแล้ว 180 วินาที');break;case'close':modal('ปิดรับคำตอบก่อนหมดเวลา','<p>คำตอบที่ส่งแล้วจะเก็บไว้ และจะไม่รับคำตอบใหม่หลังปิด</p>',btn('กลับไปทำต่อ','dismiss')+btn('ปิดรับคำตอบ','confirmClose','danger'));break;case'confirmClose':await change('close');dismiss();break;case'review':await change('review');break;case'archive':await change('archive');break;case'newSession':modal('เปิดห้องเรียนใหม่','<p>ผลเดิมยังเก็บอยู่ใน Sheet แต่ dashboard จะเปลี่ยนไปแสดงห้องใหม่ ผู้เรียนต้องกรอกข้อมูลเข้าร่วมใหม่</p>',btn('ยกเลิก','dismiss')+btn('เปิดห้องใหม่','confirmNew','primary'));break;case'confirmNew':await change('newSession');dismiss();break;case'paper':modal('บันทึกบัตรกระดาษ',`<label class="field-label" for="paperCount">จำนวนผู้ตอบด้วยบัตรกระดาษ</label><input class="field" id="paperCount" type="number" min="0" max="30" value="${dashboard.paperFallbackCount}"><label class="field-label" for="paperNos">เลขที่ (ถ้ามี)</label><input class="field" id="paperNos" value="${dashboard.paperStudentNos.join(', ')}" placeholder="เช่น 3, 8, 15"><p style="margin-top:13px">ใช้ตรวจรายชื่อซ้ำ แยกจากคำตอบในระบบเสมอ</p>`,btn('ยกเลิก','dismiss')+btn('บันทึก','savePaper','primary'));break;case'savePaper':{const count=Number($('#paperCount').value),text=$('#paperNos').value.trim(),studentNos=text?text.split(/[,\s]+/).filter(Boolean).map(Number):[];await change('paper',{count,studentNos});dismiss();notify('บันทึกจำนวนกระดาษแล้ว');break;}case'export':{notify('กำลังสร้างผลใน Drive...');const result=await rpc('export');modal('ส่งออกผลแล้ว',`<p>เก็บผลในโฟลเดอร์ Drive ที่กำหนดแล้ว<br>ผู้ตอบเว็บ ${result.nDigital} คน · กระดาษ ${result.nPaper} คน</p><div style="margin-top:20px"><a class="button primary" href="${esc(result.url)}" target="_blank" rel="noopener">${icon('download')}เปิดไฟล์ผลใน Drive</a></div>`,btn('ปิด','dismiss'));break;}case'logout':try{await rpc('logout');}finally{teacherToken='';dashboard=null;try{sessionStorage.removeItem('mc-teacher-token');}catch{}await navigate('student');}break;case'confirmReset':{const studentNo=Number($('#resetNo').value);await change('resetSeat',{studentNo});dismiss();notify('ปลดเลขที่แล้ว ให้เข้าร่วมจากอุปกรณ์ใหม่ได้');break;}}}catch(err){notify(err.message,true);}}
document.addEventListener('click',e=>{const tab=e.target.closest('[data-chart]');if(tab){chart=Number(tab.dataset.chart);render();return;}const reset=e.target.closest('[data-reset]');if(reset){modal('เปลี่ยนอุปกรณ์ของนักเรียน',`<p>ปลดเลขที่ ${reset.dataset.reset} เพื่อให้เข้าร่วมใหม่จากอุปกรณ์อื่น ไม่เปลี่ยนคำตอบที่ส่งแล้ว</p><input type="hidden" id="resetNo" value="${reset.dataset.reset}">`,btn('ยกเลิก','dismiss')+btn('ปลดเลขที่','confirmReset','danger'));return;}const b=e.target.closest('[data-action]');if(b&&!b.disabled)act(b.dataset.action);});
$('#teacherEntry').onclick=login;$('#homeLink').onclick=e=>{e.preventDefault();navigate('student');};
$('#modal').addEventListener('click',e=>{if(e.target===$('#modal')){const r=$('#modal').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dismiss();}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){refresh();schedule();}});
async function init(){if(claim)restoreWork();render();if(HAS_GAS){await refresh(true);schedule();}else if(!DEPLOYED_URL){const text=$('#connectionText');if(text)text.textContent='เปิดได้จากลิงก์เว็บที่ deploy แล้วเท่านั้น';}}init();setInterval(tick,500);

</script>
</body></html>
